basePath: /
definitions:
  data-service_internal_adapters_http_dto.ErrorResponse:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
  data-service_internal_adapters_http_dto.ProbeResponse:
    properties:
      message:
        type: string
      status:
        type: boolean
    type: object
  data-service_internal_adapters_http_dto.RoadCongestionItem:
    properties:
      camera_id:
        type: string
      congestion_score:
        type: number
      observed_at:
        type: string
      raw_ml:
        type: string
      s3_key:
        type: string
      segment_id:
        type: string
    type: object
  data-service_internal_adapters_http_dto.RoadCongestionListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/data-service_internal_adapters_http_dto.RoadCongestionItem'
        type: array
    type: object
  data-service_internal_adapters_http_dto.RoadIncidentItem:
    properties:
      camera_id:
        type: string
      crash_probability:
        type: number
      incident_label:
        type: string
      observed_at:
        type: string
      raw_ml:
        type: string
      s3_key:
        type: string
      segment_id:
        type: string
    type: object
  data-service_internal_adapters_http_dto.RoadIncidentsListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/data-service_internal_adapters_http_dto.RoadIncidentItem'
        type: array
    type: object
info:
  contact: {}
  description: 'HTTP API: health/probe, чтение ClickHouse road_incidents и road_congestion,
    Swagger.'
  title: ITS Data Service API
  version: "1.0"
paths:
  /api/v1/road_congestion:
    get:
      parameters:
      - description: Фильтр по segment_id
        in: query
        name: segment_id
        type: string
      - description: Фильтр по camera_id
        in: query
        name: camera_id
        type: string
      - description: Лимит строк (по умолчанию 100, макс. 500)
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data-service_internal_adapters_http_dto.RoadCongestionListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data-service_internal_adapters_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data-service_internal_adapters_http_dto.ErrorResponse'
      summary: Список записей road_congestion
  /api/v1/road_incidents:
    get:
      parameters:
      - description: Фильтр по segment_id
        in: query
        name: segment_id
        type: string
      - description: Фильтр по camera_id
        in: query
        name: camera_id
        type: string
      - description: Лимит строк (по умолчанию 100, макс. 500)
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data-service_internal_adapters_http_dto.RoadIncidentsListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data-service_internal_adapters_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data-service_internal_adapters_http_dto.ErrorResponse'
      summary: Список записей road_incidents
  /health:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data-service_internal_adapters_http_dto.ProbeResponse'
      summary: Liveness / health
  /probe/health:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data-service_internal_adapters_http_dto.ProbeResponse'
      summary: Health (probe path)
  /probe/ready:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data-service_internal_adapters_http_dto.ProbeResponse'
      summary: Readiness probe
swagger: "2.0"
