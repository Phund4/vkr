# Контур видео: список камер, сегменты и RTSP. Загрузка кадров в S3 — pusher (Kafka its.frames.ingest).
storage:
  prefix: "its-ingest"

ingest:
  target_fps: 5
  process_workers: 5
  ffmpeg_path: "ffmpeg"

metrics:
  listen_addr: ":9091"

cameras:
  - segment_id: "ring-road-5"
    camera_id: "cam-01"
    rtsp_url: "rtsp://localhost:8554/cam-01"
  - segment_id: "ring-road-5"
    camera_id: "cam-02"
    rtsp_url: "rtsp://localhost:8554/cam-02"
  - segment_id: "ring-road-5"
    camera_id: "cam-03"
    rtsp_url: "rtsp://localhost:8554/cam-03"
  - segment_id: "ring-road-5"
    camera_id: "cam-04"
    rtsp_url: "rtsp://localhost:8554/cam-04"
