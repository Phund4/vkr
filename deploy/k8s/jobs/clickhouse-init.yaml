apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-init
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: clickhouse/clickhouse-server:24.8
          command: ["/bin/sh", "-lc"]
          args:
            - |
              clickhouse-client --host clickhouse --port 9000 --multiquery < /sql/init.sql
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: clickhouse-init-sql
