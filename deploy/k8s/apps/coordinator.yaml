apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
    spec:
      containers:
        - name: coordinator
          image: traffic/coordinator:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8098
          env:
            - name: SERVICE_NAME
              value: coordinator
            - name: LOG_FORMAT
              value: json
            - name: LOG_LEVEL
              value: info
            - name: LISTEN_ADDR
              value: ":8098"
            - name: DATABASE_URL
              value: postgres://coordinator:coordinator@postgres:5432/coordinator?sslmode=disable
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
spec:
  type: LoadBalancer
  selector:
    app: coordinator
  ports:
    - port: 8098
      targetPort: 8098
