apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-service
  template:
    metadata:
      labels:
        app: data-service
    spec:
      containers:
        - name: data-service
          image: traffic/data-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8610
            - containerPort: 8611
          env:
            - name: ENV
              value: dev
            - name: SERVICE_NAME
              value: data-service
            - name: LOG_FORMAT
              value: json
            - name: LOG_LEVEL
              value: info
            - name: SERVER_PORT
              value: ":8610"
            - name: PROMETHEUS_PORT
              value: "8611"
            - name: METRICS_NAMESPACE
              value: data_service
            - name: METRICS_SUBSYSTEM
              value: api
            - name: CLICKHOUSE_HOST
              value: clickhouse:8123
            - name: CLICKHOUSE_DATABASE
              value: default
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              value: ""
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: S3_BUCKET
              value: its-frames
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: traffic-secrets
                  key: minio-access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: traffic-secrets
                  key: minio-secret-key
---
apiVersion: v1
kind: Service
metadata:
  name: data-service
spec:
  type: LoadBalancer
  selector:
    app: data-service
  ports:
    - name: http
      port: 8610
      targetPort: 8610
    - name: metrics
      port: 8611
      targetPort: 8611
