# Prometheus в Docker, приложения в Kubernetes (namespace traffic).
# Нужен kubeconfig в контейнере (make observability-k8s-up).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: kubernetes-traffic
    kubernetes_sd_configs:
      - role: endpoints
        kubeconfig_file: /etc/prometheus/kubeconfig
        namespaces:
          names:
            - traffic
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        regex: router|analytics|coordinator|ml-serving|pusher|data-service|rtsp-generator
        action: keep
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        regex: http
        action: drop
      - source_labels: [__meta_kubernetes_service_name]
        target_label: job
      - source_labels: [__meta_kubernetes_pod_name, __meta_kubernetes_endpoint_port_number]
        separator: ":"
        target_label: instance

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
