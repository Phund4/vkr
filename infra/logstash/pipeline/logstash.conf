input {
  beats {
    port         => 5044
    ssl_enabled  => false
  }
}

filter {
  # Распаковка JSON из stdout контейнеров (slog/zerolog/FastAPI) в поля документа.
  json {
    source => "message"
    skip_on_invalid_json => true
  }
}

# Имя индекса НЕ должно быть logstash-* : в ES 8 встроенные шаблоны вешают data stream на logstash-*,
# тогда нужен op_type create, а плагин шлёт index → 400. Свой префикс = обычные индексы.

output {
  elasticsearch {
    hosts             => ["http://elasticsearch:9200"]
    data_stream       => false
    index             => "traffic-docker-logs-%{+yyyy.MM.dd}"
    ilm_enabled       => false
    manage_template   => false
  }
}
