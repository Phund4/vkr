# Профили (см. infra/Makefile):
#   infra         — БД, брокеры, MinIO, ClickHouse, MediaMTX, rtsp-generator (то же ядро, что в deploy/k8s).
#   observability — ELK, Prometheus, Grafana, экспортёры, cAdvisor, blackbox (в K8s не разворачивается).
#   apps          — образы из ../services/ (coordinator, analytics, pusher, data-service, ml-serving, router).
name: traffic-infra

services:
  postgres:
    image: postgres:16
    hostname: postgres
    profiles: [infra, apps]
    environment:
      POSTGRES_DB: coordinator
      POSTGRES_USER: coordinator
      POSTGRES_PASSWORD: coordinator
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - its
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coordinator -d coordinator"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  # KRaft (официальный apache/kafka): без ZooKeeper, данные в томе на log.dirs.
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    profiles: [infra, apps]
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: -Xmx512M -Xms256M
    volumes:
      - kafka-kraft-data:/tmp/kraft-combined-logs
    networks:
      - its
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 45s

  kafka-topics-init:
    image: apache/kafka:3.9.0
    profiles: [infra, apps]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for i in $$(seq 1 40); do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1 && break
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic its.video.ingest --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic its.frames.ingest --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic its.persist.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic its.ml.accident.in --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic its.ml.accident.out --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic its.ml.congestion.in --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic its.ml.congestion.out --partitions 3 --replication-factor 1
    networks:
      - its
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    hostname: elasticsearch
    profiles: [observability]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - its
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 40s

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.0
    hostname: logstash
    profiles: [observability]
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx512m
      - PIPELINE_WORKERS=2
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"
      - "9600:9600"
    networks:
      - its
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    hostname: kibana
    profiles: [observability]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - SERVER_HOST=0.0.0.0
    ports:
      - "5601:5601"
    networks:
      - its
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.0
    hostname: filebeat
    profiles: [observability]
    user: root
    # Образ по умолчанию передаёт CMD "-environment container" → filebeat воспринимает "container" как подкоманду.
    command: ["filebeat", "-e", "--strict.perms=false", "-c", "/usr/share/filebeat/filebeat.yml"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - its
    depends_on:
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_started
    restart: unless-stopped

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.7.0
    hostname: elasticsearch-exporter
    profiles: [observability]
    command:
      - "--es.uri=http://elasticsearch:9200"
      - "--es.all"
    networks:
      - its
    depends_on:
      elasticsearch:
        condition: service_healthy

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    hostname: postgres-exporter
    profiles: [observability]
    environment:
      DATA_SOURCE_NAME: "postgresql://coordinator:coordinator@postgres:5432/coordinator?sslmode=disable"
    networks:
      - its

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    hostname: kafka-exporter
    profiles: [observability]
    command:
      - "--kafka.server=kafka:9092"
    networks:
      - its

  clickhouse-exporter:
    image: f1yegor/clickhouse-exporter:latest
    hostname: clickhouse-exporter
    profiles: [observability]
    command:
      - "-scrape_uri=http://default:@clickhouse:8123"
    networks:
      - its

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    hostname: clickhouse
    profiles: [infra, apps]
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    networks:
      - its
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  clickhouse-init:
    image: clickhouse/clickhouse-server:24.8
    hostname: clickhouse-init
    profiles: [infra, apps]
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "clickhouse-client --host clickhouse --port 9000 --query \"
      CREATE TABLE IF NOT EXISTS default.road_incidents
      (
          observed_at DateTime64(3, 'UTC'),
          segment_id LowCardinality(String),
          camera_id LowCardinality(String),
          s3_key String,
          crash_probability Float64,
          incident_label LowCardinality(String),
          raw_ml String
      )
      ENGINE = MergeTree
      ORDER BY (segment_id, camera_id, observed_at);
      CREATE TABLE IF NOT EXISTS default.road_congestion
      (
          observed_at DateTime64(3, 'UTC'),
          segment_id LowCardinality(String),
          camera_id LowCardinality(String),
          s3_key String,
          congestion_score Float64,
          raw_ml String
      )
      ENGINE = MergeTree
      ORDER BY (segment_id, camera_id, observed_at);
      \""
    restart: "no"
    networks:
      - its

  clickhouse-infra-sim-seed:
    image: clickhouse/clickhouse-server:24.8
    profiles: [infra]
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        clickhouse-client --host clickhouse --port 9000 --multiquery < /seed/001_schema.sql &&
        clickhouse-client --host clickhouse --port 9000 --multiquery < /seed/002_seed.sql
    volumes:
      - ./clickhouse/001_schema.sql:/seed/001_schema.sql:ro
      - ./clickhouse/002_seed.sql:/seed/002_seed.sql:ro
    networks:
      - its
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    hostname: minio
    profiles: [infra, apps]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9050:9000"
      - "9051:9001"
    networks:
      - its
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    hostname: minio-init
    profiles: [infra, apps]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "mc alias set local http://minio:9000 minioadmin minioadmin &&
       mc mb -p local/its-frames || true"
    restart: "no"
    networks:
      - its

  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    hostname: mediamtx
    profiles: [infra, apps]
    ports:
      - "8554:8554"
    networks:
      - its

  rtsp-generator:
    build:
      context: ./rtsp-generator
      dockerfile: Dockerfile
    hostname: rtsp-generator
    profiles: [infra, apps]
    environment:
      SERVICE_NAME: rtsp-generator
      LOG_FORMAT: json
      LOG_LEVEL: info
      LISTEN_ADDR: ":8096"
      RTSP_PUBLISH_BASE: rtsp://mediamtx:8554
      SIM_VIDEO_DIR: /videos
      SIM_FPS: "25"
      SIM_SIZE: "1280x720"
    volumes:
      - ../.data/videos:/videos:ro
    ports:
      - "8096:8096"
    depends_on:
      - mediamtx
    networks:
      - its

  coordinator:
    build:
      context: ../services/coordinator
      dockerfile: Dockerfile
    hostname: coordinator
    profiles: [apps]
    environment:
      SERVICE_NAME: coordinator
      LOG_FORMAT: json
      LOG_LEVEL: info
      DATABASE_URL: postgres://coordinator:coordinator@postgres:5432/coordinator?sslmode=disable
      LISTEN_ADDR: ":8098"
    ports:
      - "8098:8098"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - its

  analytics:
    build:
      context: ../services/analytics
      dockerfile: Dockerfile
    hostname: analytics
    profiles: [apps]
    environment:
      SERVICE_NAME: analytics
      LOG_FORMAT: json
      LOG_LEVEL: info
      LISTEN_ADDR: ":8093"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: analytics-ingest
      KAFKA_TOPIC_VIDEO: its.video.ingest
      KAFKA_TOPIC_ML_ACCIDENT_OUT: its.ml.accident.out
      KAFKA_TOPIC_ML_CONGESTION_OUT: its.ml.congestion.out
      KAFKA_TOPIC_PERSIST: its.persist.events
    ports:
      - "8093:8093"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
    networks:
      - its

  pusher:
    build:
      context: ../services/pusher
      dockerfile: Dockerfile
    hostname: pusher
    profiles: [apps]
    environment:
      SERVICE_NAME: pusher
      LOG_FORMAT: json
      LOG_LEVEL: info
      ENV: dev
      SERVER_PORT: ":8094"
      PROMETHEUS_PORT: "8082"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: pusher
      KAFKA_TOPIC_PERSIST: its.persist.events
      KAFKA_TOPIC_FRAMES: its.frames.ingest
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DATABASE: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: its-frames
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "8094:8094"
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - its

  data-service:
    build:
      context: ../services/data-service
      dockerfile: Dockerfile
    hostname: data-service
    profiles: [apps]
    environment:
      ENV: dev
      SERVICE_NAME: data-service
      LOG_FORMAT: json
      LOG_LEVEL: info
      SERVER_PORT: ":8610"
      PROMETHEUS_PORT: "8611"
      METRICS_NAMESPACE: data_service
      METRICS_SUBSYSTEM: api
      CLICKHOUSE_HOST: clickhouse:8123
      CLICKHOUSE_DATABASE: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: its-frames
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "8610:8610"
      - "8611:8611"
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    networks:
      - its

  ml-serving:
    build:
      context: ../services/ml-serving
      dockerfile: Dockerfile
    hostname: ml-serving
    profiles: [apps]
    environment:
      SERVING_ROOT: /app
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: ml-serving
      KAFKA_TOPIC_ML_ACCIDENT_IN: its.ml.accident.in
      KAFKA_TOPIC_ML_ACCIDENT_OUT: its.ml.accident.out
      KAFKA_TOPIC_ML_CONGESTION_IN: its.ml.congestion.in
      KAFKA_TOPIC_ML_CONGESTION_OUT: its.ml.congestion.out
      WINNERS_JSON: /app/models/winners.json
      ML_INFER_MAX_THREADS: "8"
      TORCH_NUM_THREADS: "1"
      CONGESTION_INTERVAL_SEC: "2"
    volumes:
      - ../.data/artifacts:/app/artifacts:ro
    ports:
      - "8000:8000"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
    networks:
      - its

  router:
    build:
      context: ../services/router
      dockerfile: Dockerfile
    hostname: router
    profiles: [apps]
    environment:
      SERVICE_NAME: router
      LOG_FORMAT: json
      LOG_LEVEL: info
      CONFIG_PATH: /app/config.cameras.docker.yaml
      COORDINATOR_BASE_URL: http://coordinator:8098
      COORDINATOR_ZONE_ID: zone-a
      COORDINATOR_CLUSTER_ID: cluster-1
      COORDINATOR_INSTANCE_ID: ingest-a1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_VIDEO: its.video.ingest
      KAFKA_TOPIC_FRAMES: its.frames.ingest
      KAFKA_TOPIC_ML_ACCIDENT_IN: its.ml.accident.in
      KAFKA_TOPIC_ML_CONGESTION_IN: its.ml.congestion.in
    volumes:
      - ../services/router/config.cameras.docker.yaml:/app/config.cameras.docker.yaml:ro
    ports:
      - "9091:9091"
    depends_on:
      coordinator:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      mediamtx:
        condition: service_started
      rtsp-generator:
        condition: service_started
    networks:
      - its

  prometheus:
    image: prom/prometheus:v2.55.1
    hostname: prometheus
    profiles: [observability]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - its

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    hostname: blackbox-exporter
    profiles: [observability]
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    volumes:
      - ./blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"
    networks:
      - its

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    hostname: cadvisor
    profiles: [observability]
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - its

  grafana:
    image: grafana/grafana:11.3.0
    hostname: grafana
    profiles: [observability]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CHANGE: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - its

networks:
  its:
    name: traffic-its

volumes:
  postgres-data:
  kafka-kraft-data:
  es-data:
  clickhouse-data:
  minio-data:
  prometheus-data:
  grafana-data:
